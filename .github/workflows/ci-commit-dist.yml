name: Commit latest dist artifacts into repo

on:
  workflow_run:
    workflows: ["Build NetProbe (APK / EXE / AppImage)"]
    types: [completed]
    branches: [main]

jobs:
  commit-dist:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download latest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NetProbe-*
          merge-multiple: true
          path: dist/
      - name: Commit dist/latest to repo
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p dist/latest
          # Copy the newest APK, EXE zip, AppImage into dist/latest/
          if ls dist/*.AppImage 1>/dev/null 2>&1; then
            cp dist/*.AppImage dist/latest/NetProbe-x86_64.AppImage
          fi
          if ls dist/*.zip 1>/dev/null 2>&1; then
            cp dist/*.zip dist/latest/NetProbe-windows.zip
          fi
          if ls dist/*.apk 1>/dev/null 2>&1; then
            cp dist/*.apk dist/latest/NetProbe.apk
          fi
          git lfs install
          git add -f dist/latest/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update dist/latest with latest CI artifacts [skip ci]"
          git push origin HEAD:main