name: Build NetProbe (APK / EXE / AppImage)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: pytest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: pip install -e ".[dev,gui]"
      - name: Run tests
        run: pytest -q --cov --cov-report=term

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: |
          pip install -e ".[dev,gui]"
          pip install "pyinstaller>=6.0"
          sudo apt-get update && sudo apt-get install -y patchelf desktop-file-utils
      - name: Fetch xray (linux)
        run: python scripts/fetch_xray.py -o bin
      - name: PyInstaller bundle
        run: |
          pyinstaller --noconfirm --onefile \
            --collect-all flet \
            --collect-all flet_desktop \
            --name netprobe-gui \
            --add-data "bin/xray:bin" \
            --add-data "config:config" \
            --hidden-import gui \
            --hidden-import gui.backend \
            gui/main.py
      - name: Bundle xray + build AppImage
        run: |
          APPDIR=dist/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications"
          cp dist/netprobe-gui "$APPDIR/usr/bin/netprobe-gui"
          cp bin/xray "$APPDIR/usr/bin/xray"
          # .desktop file
          printf '[Desktop Entry]\nType=Application\nName=NetProbe\nExec=netprobe-gui\nIcon=netprobe\nCategories=Network;\n' > "$APPDIR/netprobe.desktop"
          cp "$APPDIR/netprobe.desktop" "$APPDIR/usr/share/applications/"
          # Generate a simple PNG icon (green background, white N)
          python3 -c "
import zlib, struct
W=H=256; px=bytearray()
for y in range(H):
    px.append(0)
    for x in range(W):
        r,g,b=31,138,76
        if (x<70 and y>60) or (x>186 and y<200) or (50<x<206 and abs(y-(H-x))<18):
            r,g,b=255,255,255
        px+=struct.pack('BBB',r,g,b)
def chunk(t,d):
    c=struct.pack('>I',len(d))+t+d
    c+=struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
    return c
png=b'\x89PNG\r\n\x1a\n'
png+=chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))
png+=chunk(b'IDAT',zlib.compress(bytes(px),9))
png+=chunk(b'IEND',b'')
open('$APPDIR/usr/share/icons/hicolor/256x256/apps/netprobe.png','wb').write(png)
"
          # linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --desktop-file "$APPDIR/netprobe.desktop" \
            --output appimage
          mv NetProbe-*.AppImage dist/NetProbe-x86_64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-linux
          path: dist/NetProbe-x86_64.AppImage

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install deps
        run: |
          pip install -e ".[dev,gui]"
          pip install "pyinstaller>=6.0"
      - name: Fetch xray (windows)
        run: python scripts/fetch_xray.py -o bin
      - name: PyInstaller bundle
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --collect-all flet `
            --collect-all flet_desktop `
            --name netprobe-gui `
            --add-data "bin/xray.exe;bin" `
            --add-data "config;config" `
            --hidden-import gui `
            --hidden-import gui.backend `
            gui/main.py
      - name: Package zip
        run: |
          $dist = "dist/NetProbe-windows.zip"
          Compress-Archive -Path "dist/netprobe-gui.exe","bin/xray.exe" -DestinationPath $dist -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-windows
          path: dist/NetProbe-windows.zip

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Fetch xray (android arm64)
        run: python scripts/fetch_xray.py -o android/app/src/main/assets
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27b
          cmdline-tools-version: latest
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=NetProbe Debug,O=NetProbe,C=US"
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=../debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=debug \
            -Pandroid.injected.signing.key.password=android
      - name: Copy APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/NetProbe.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-android
          path: dist/NetProbe.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux-appimage, windows-exe, android-apk]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetProbe-x86_64.AppImage
            dist/NetProbe-windows.zip
            dist/NetProbe.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
