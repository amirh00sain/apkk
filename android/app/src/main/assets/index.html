<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NetProbe</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, Roboto, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 18px;
    }
    h1 { font-size: 30px; margin: 0; }
    .sub { opacity: 0.6; font-size: 14px; margin-bottom: 8px; }
    button {
      width: 220px; height: 56px; border-radius: 28px; border: none;
      font-size: 18px; color: #fff; background: #1f8a4c; cursor: pointer;
    }
    button.connect { background: #1f8a4c; }
    button.disconnect { background: #b3343a; }
    button:disabled { opacity: 0.5; }
    .status { font-size: 16px; }
    .detail { font-size: 12px; opacity: 0.7; max-width: 80%; text-align: center; }
  </style>
</head>
<body>
  <h1>NetProbe</h1>
  <div class="sub">DoH + Tor + Fragment (TUN)</div>
  <button id="toggle" class="connect" onclick="toggle()">Connect</button>
  <div class="status" id="status">Idle — press Connect</div>
  <div class="detail" id="detail"></div>

  <script>
    let state = "idle";
    function toggle() {
      if (state === "connected" || state === "connecting") {
        VpnBridge.disconnect();
        setStatus("Disconnecting…", "connect", "Disconnect");
      } else {
        VpnBridge.connect();
        setStatus("Connecting…", "disconnect", "Disconnect");
      }
    }
    function setStatus(text, cls, label) {
      document.getElementById("status").textContent = text;
      const btn = document.getElementById("toggle");
      btn.className = cls;
      btn.textContent = label;
    }
    // Called from Kotlin (JavascriptInterface).
    function onVpnState(s) {
      state = s;
      const btn = document.getElementById("toggle");
      if (s === "connected") {
        document.getElementById("status").textContent = "Connected";
        document.getElementById("detail").textContent = "DoH + Fragment + Tor over TUN";
        btn.className = "disconnect";
        btn.textContent = "Disconnect";
      } else if (s === "disconnected") {
        document.getElementById("status").textContent = "Idle — press Connect";
        document.getElementById("detail").textContent = "";
        btn.className = "connect";
        btn.textContent = "Connect";
      } else if (s === "permission-denied") {
        document.getElementById("status").textContent = "VPN permission denied";
        document.getElementById("detail").textContent = "Grant VPN permission to start the tunnel.";
        btn.className = "connect";
        btn.textContent = "Connect";
      }
    }
  </script>
</body>
</html>
