[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "1.0.0"
description = "Network traffic analysis, DNS/TLS/CDN inspection, and traffic classification framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "cryptography>=42.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "typer>=0.12",
    "orjson>=3.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "gui*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "scapy>=2.5",
    "pyinstaller>=6.0",
]
gui = [
    "flet>=0.24",
]

[project.scripts]
netprobe = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests", "gui/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "gui"]
omit = ["app/tun_linux.py", "gui/main.py"]

[tool.coverage.report]
fail_under = 80
